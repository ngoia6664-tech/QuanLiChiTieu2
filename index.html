<!DOCTYPE html>
<html lang="vi" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Chi Tiêu Pro - Quản Lý Tài Chính Cá Nhân</title>
<meta name="theme-color" content="#070611">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chi Tiêu Pro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Thanh đo tiến trình cuộn mượt ở đỉnh -->
<div class="scroll-tracker" id="scrollTracker"></div>

<!-- Nền Canvas Tinh Tú Lấp Lánh -->
<canvas id="bgCanvas"></canvas>

<!-- Nền Cực Quang Biến Đổi Màu Sắc Theo Cuộn Chuột -->
<div class="nebula-mesh" id="nebulaMesh"></div>
<div class="stardust-overlay"></div>

<!-- Chỉ báo màu sắc biến đổi mini góc dưới -->
<div class="color-hud" id="colorHud">
  <div class="color-ball" id="hudBall"></div>
  <span id="hudText">🌈 Nền: Tím Ngân Hà</span>
</div>

<!-- Canvas pháo hoa mini ăn mừng khi tick -->
<canvas id="confettiCanvas"></canvas>

<!-- Dynamic Island nổi ghim số dư khi cuộn qua thẻ -->
<div class="dynamic-island" id="dynamicIsland">
  <div class="dot"></div>
  <div class="island-info">
    <div class="title" id="islandTitle">Còn lại: <b>0đ</b></div>
  </div>
  <div class="badge" id="islandBadge">Chi Tiêu Pro ↑</div>
</div>

<!-- Container chính chứa toàn bộ ứng dụng -->
<div class="wrap" id="app"></div>

<script src="js/app.js"></script>
</body>
</html>
