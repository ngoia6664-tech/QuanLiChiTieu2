<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chi tiêu</title>
<meta name="theme-color" content="#4A3BCB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chi tiêu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F1FA; --card:#FFFFFF; --ink:#1B1938; --muted:#74728F; --line:#E4E2F3;
  --brand:#5B47E0; --brand-soft:#ECE9FF; --on-brand:#FFFFFF;
  --ok:#12936A; --ok-soft:#DDF5EC; --warn:#B96D00; --warn-soft:#FFF0D6; --bad:#D6403A; --bad-soft:#FFE4E1;
  --hero:linear-gradient(150deg,#4A3BCB 0%,#6F4FE8 55%,#9B5DE5 100%);
  --hero-shadow:0 16px 32px -14px rgba(91,71,224,.6);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0D1B; --card:#181730; --ink:#EDEBFF; --muted:#9A98BC; --line:#2B2A4A;
    --brand:#9A8CFF; --brand-soft:#26224D; --on-brand:#14102E;
    --ok:#4ADBA6; --ok-soft:#10352B; --warn:#FFC25E; --warn-soft:#3B2C10; --bad:#FF8279; --bad-soft:#40201F;
    --hero:linear-gradient(150deg,#2A2370 0%,#4A34A8 60%,#6B3FA8 100%);
    --hero-shadow:0 16px 32px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0D1B; --card:#181730; --ink:#EDEBFF; --muted:#9A98BC; --line:#2B2A4A;
  --brand:#9A8CFF; --brand-soft:#26224D; --on-brand:#14102E;
  --ok:#4ADBA6; --ok-soft:#10352B; --warn:#FFC25E; --warn-soft:#3B2C10; --bad:#FF8279; --bad-soft:#40201F;
  --hero:linear-gradient(150deg,#2A2370 0%,#4A34A8 60%,#6B3FA8 100%);
  --hero-shadow:0 16px 32px -14px rgba(0,0,0,.7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 90px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s ease,background-color .15s ease,border-color .15s ease}
button:active{transform:scale(.96)}

.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.sel{appearance:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;color:var(--ink);max-width:150px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 11px;font-weight:600}
.ibtn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.ibtn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}

.sum{--paid:#7CF2C0;--unpaid:#FFC95E;--save:rgba(255,255,255,.5);
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.2),transparent 55%),var(--hero);
  color:#fff;border-radius:22px;padding:18px;box-shadow:var(--hero-shadow)}
.sum .lbl{color:rgba(255,255,255,.78);font-size:13px}
.big{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 2px}
.big.neg{color:#FFB4AB}
.flow{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.2);margin:14px 0 8px}
.flow i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.flow.grow i{animation:grow .8s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:rgba(255,255,255,.8)}
.legend b{color:#fff;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{background:var(--bg);border-radius:14px;padding:10px 12px;text-align:left;border:1px solid transparent;width:100%}
.mini .v{font-weight:700;font-size:16px}
.mini .lbl{font-size:12px;color:var(--muted)}
.sum .mini{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sum .mini .lbl{color:rgba(255,255,255,.75)}
.sum .mini .v{color:#fff}
.note{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:13.5px;background:rgba(255,255,255,.14);color:#fff;border-left:4px solid rgba(255,255,255,.6)}
.note.warn{border-left-color:#FFC95E}
.note.bad{border-left-color:#FF8A80}
.note.ok{border-left-color:#7CF2C0}

.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;gap:8px;padding:0 2px 6px}
.sec-h .name{font-weight:700;font-size:16px;flex:1;min-width:0}
.sec-h .tot{font-size:13px;color:var(--muted);text-align:right}
.chev{background:none;border:0;padding:4px 6px;font-size:13px;color:var(--muted);transition:transform .2s ease}
.chev.open{transform:rotate(90deg)}
.tag{white-space:nowrap;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand);margin-left:6px;font-weight:600}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:2px 0 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#8F7BFF);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.warn i{background:linear-gradient(90deg,#E8A23A,#FFC25E)}
.bar.bad i{background:linear-gradient(90deg,#D6403A,#FF7A70)}
.bar.grow i{animation:grow .8s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}

.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden;box-shadow:0 1px 2px rgba(27,25,56,.05)}
.cat.over{border-left:4px solid var(--bad)}
.cat-h{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.cat-h .name{font-weight:600;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.ico{flex:none;width:32px;height:32px;border-radius:11px;background:var(--brand-soft);display:grid;place-items:center;font-size:16px}
.cat.over .ico{background:var(--bad-soft)}
.cat-h .amt{font-size:13.5px;text-align:right}
.cat-h .amt small{color:var(--muted)}
.cat-h .amt.bad{color:var(--bad);font-weight:600}
.cat-bar{padding:0 12px 6px}
.alert{margin:2px 12px 6px;font-size:12.5px;color:var(--bad);background:var(--bad-soft);padding:6px 10px;border-radius:8px;font-weight:500}
.alert.w{color:var(--warn);background:var(--warn-soft)}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.chk{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0;color:transparent;font-size:14px;font-weight:700;opacity:.9}
.chk.on{background:linear-gradient(135deg,#12A674,#2BC48F);border-color:transparent;color:#fff;opacity:1}
.chk.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.item .nm{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left;background:none;border:0;padding:0;transition:color .2s}
.item .nm.done{color:var(--muted);text-decoration:line-through}
.item .pr{font-weight:600;white-space:nowrap}
.item .pr.done{color:var(--muted);font-weight:500}
.need{color:var(--brand);background:var(--brand-soft);padding:3px 9px;border-radius:20px;font-size:12.5px}
.item .sub{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.addrow{display:flex;gap:8px;padding:6px 12px 10px;border-top:1px solid var(--line)}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:6px 2px}
.empty{padding:6px 12px 10px;color:var(--muted);font-size:13.5px}
.addsec{width:100%;margin-top:20px;padding:14px;border:1.5px dashed var(--brand);border-radius:16px;background:var(--brand-soft);color:var(--brand);font-weight:600}

.ov{position:fixed;inset:0;background:rgba(14,10,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s ease}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 12px;font-size:17px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input[type=text],.fld input[type=month],.fld textarea,.fld select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.fld textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.fld textarea.plain{font-family:inherit;font-size:16px;min-height:150px}
.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}
.fld.cb{display:flex;gap:10px;align-items:flex-start}
.fld.cb label{margin:0;color:var(--ink);font-size:14.5px}
.fld.cb input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--brand)}
.btns{display:flex;gap:8px;margin-top:6px}
.btns button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.btns .save{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btns .del{color:var(--bad);flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 1px 2px rgba(27,25,56,.05)}
.card>b:first-child{font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.seg button{padding:10px;border-radius:12px;border:0;background:none;font-weight:700;color:var(--muted)}
.seg button.on{color:var(--on-brand);background:var(--brand);box-shadow:0 8px 20px -10px var(--brand)}
.chart{display:flex;align-items:flex-end;gap:6px;height:200px;margin-top:12px;padding-top:20px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0;cursor:pointer}
.col .val{font-size:11px;font-weight:700;color:var(--brand);margin-bottom:4px;white-space:nowrap}
.col .pillar{position:relative;width:100%;max-width:40px;border-radius:9px 9px 4px 4px;background:var(--brand-soft);overflow:hidden;min-height:4px;display:flex;align-items:flex-end;box-shadow:inset 0 0 0 1px var(--line)}
.col .pillar i{display:block;width:100%;background:linear-gradient(180deg,#8F7BFF,var(--brand));box-shadow:0 0 14px -2px var(--brand)}
.col.on .pillar{box-shadow:inset 0 0 0 2px var(--brand),0 0 18px -4px var(--brand)}
.col.on .val{color:var(--ink)}
.xl{display:flex;gap:6px;margin-top:6px}
.xl div{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);line-height:1.25}
.xl div b{display:block;color:var(--ink);font-size:12px}
.xl div.on b{color:var(--brand)}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.drow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow:last-of-type{border-bottom:0}
.drow b.neg{color:var(--bad)}
.cbar{margin-top:10px}
.cbar .t{display:flex;justify-content:space-between;font-size:13.5px}
.cbar .t small{color:var(--muted)}
.cbar .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px;display:flex}
.cbar .tr i{display:block;height:100%}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-top:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.srow .m{flex:1;min-width:0}
.srow .m b{display:block}
.srow .m small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.srow .v{font-weight:700;font-size:16px;white-space:nowrap;text-align:right}
.srow .v small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.srow .v.pos{color:var(--ok)}
.srow .v.neg{color:var(--bad)}
.srow.future{opacity:.55}
.gtag{display:inline-block;margin-top:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px}
.gtag.ok{background:var(--ok-soft);color:var(--ok)}
.gtag.bad{background:var(--bad-soft);color:var(--bad)}
.gtag.mute{background:var(--line);color:var(--muted)}
.goalc{margin-top:12px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--brand);box-shadow:0 0 26px -14px var(--brand)}
.goalc .h{display:flex;align-items:center;gap:8px}
.goalc .h b{flex:1;font-size:16px}
.goalc .amt{font-size:22px;font-weight:800;margin-top:6px}
.goalc .amt small{font-size:14px;color:var(--muted);font-weight:600}
.goalc .gb{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.goalc .gb i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#8F7BFF);box-shadow:0 0 12px var(--brand)}
.goalc .eta{margin-top:10px;font-size:13.5px;color:var(--muted)}
.goalc .eta b{color:var(--ink)}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 12px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;animation:up .25s ease}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
var KEY = 'chitieu_v1';
var S = load();

/* ---------- storage ---------- */
function load(){
  try { var r = localStorage.getItem(KEY); if (r) { var d = JSON.parse(r); if (d && d.months) return d; } } catch(e){}
  return { current: null, months: {} };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function iconFor(n){
  var s = String(n || '').toLowerCase();
  var map = [[/ăn|cơm|phở|bún|quán|cafe|cà phê/, '🍜'], [/\bai\b|claude|gpt/, '🤖'], [/gym|thể thao/, '🏋️'], [/nợ|vay|trả góp/, '💸'],
    [/shopee|lazada|tiki|mua sắm/, '🛍️'], [/quà|người yêu|đi chơi|hẹn hò/, '🎁'], [/nhà|trọ|điện|nước|internet|wifi|hóa đơn/, '🏠'],
    [/xăng|xe|dầu|grab|đi lại/, '🛵'], [/học|sách|khóa/, '📚'], [/tiết kiệm|để dành/, '🐷'], [/sức khỏe|thuốc|khám/, '💊'], [/phát sinh|khác/, '🧾']];
  for (var i = 0; i < map.length; i++) if (map[i][0].test(s)) return map[i][1];
  return '💳';
}
function subText(it){
  var p = [];
  if (it.note) p.push(it.note);
  if (!it.amount && it.prev) p.push('tháng trước ' + fmt(it.prev));
  return p.join(' · ');
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ n = Math.round(n || 0); var neg = n < 0; var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '-' : '') + s + 'đ'; }
function parseMoney(v){
  var s = String(v || '').toLowerCase().replace(/\s+/g, '').replace(/đ|vnd|d$/g, '');
  if (!s) return 0;
  var m = s.match(/^([\d.,]+)(k|tr|m|nghin|ngan|trieu)?$/);
  if (!m) return NaN;
  if (m[2]) {
    var num = parseFloat(m[1].replace(',', '.'));
    if (isNaN(num)) return NaN;
    var mul = (m[2] === 'k' || m[2] === 'nghin' || m[2] === 'ngan') ? 1000 : 1000000;
    return Math.round(num * mul);
  }
  var digits = m[1].replace(/[.,]/g, '');
  return parseInt(digits, 10) || 0;
}
function monthKeyNow(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthLabel(k){ var p = k.split('-'); return 'Tháng ' + parseInt(p[1], 10) + '/' + p[0]; }
function sortedKeys(){ return Object.keys(S.months).sort(); }

function newMonthData(){
  return { income: 0, goal: 0, sections: [
    { id: uid(), name: 'Chi phí cố định', budget: 0, fixed: true, collapsed: false, cats: [
      { id: uid(), name: 'Nhà & hóa đơn', budget: 0, items: [] },
      { id: uid(), name: 'Tiền AI', budget: 0, items: [] }
    ]},
    { id: uid(), name: 'Chi phí bất định', budget: 0, fixed: false, collapsed: false, cats: [
      { id: uid(), name: 'Ăn uống', budget: 0, items: [] },
      { id: uid(), name: 'Phát sinh', budget: 0, items: [] }
    ]}
  ]};
}
function cloneForNext(src){
  var d = JSON.parse(JSON.stringify(src));
  d.note = '';
  d.sections.forEach(function(sec){
    sec.id = uid();
    sec.cats.forEach(function(c){
      c.id = uid();
      if (sec.fixed) {
        c.items.forEach(function(it){ it.id = uid(); it.prev = it.amount || it.prev || 0; it.amount = 0; it.paid = false; });
      } else { c.items = []; }
    });
  });
  return d;
}

function mk(name, amount, paid, note){ return { id: uid(), name: name, amount: amount, paid: !!paid, note: note || '' }; }
function cat(name, budget, items){ return { id: uid(), name: name, budget: budget, items: items }; }
function seedOct(){
  return {
    income: 12000000, goal: 2510000,
    note: 'Tháng này có khoản chi lớn bất thường: trả nợ người yêu 4,5tr + gym 4 tháng 1,05tr.\n1tr phát sinh là quỹ đệm; cuối tháng còn bao nhiêu thì nhập thêm vào tiết kiệm.\nMục tiêu: khóa cứng 2,51tr tiết kiệm, không đụng tới nếu không cần thiết.',
    sections: [
      { id: uid(), name: 'Tiền bất định cho tháng', budget: 0, fixed: false, collapsed: false, cats: [
        cat('Shopee', 0, [ mk('Shopee', 740000, true) ]),
        cat('Trả nợ người yêu', 0, [ mk('Trả nợ người yêu', 4500000, false) ]),
        cat('Gym (4 tháng)', 0, [ mk('Gym (4 tháng)', 1050000, false) ]),
        cat('Quà + đi chơi với người yêu', 700000, [
          mk('Tuần 1: mỳ trộn', 70000), mk('Tuần 2: bún chả', 70000), mk('Tuần 3: gà rán nguyên xon', 210000),
          mk('Tuần 4: chưa biết', 150000), mk('Quà', 200000) ])
      ]},
      { id: uid(), name: 'Tiền cố định cho tháng', budget: 0, fixed: true, collapsed: false, cats: [
        cat('AI', 1100000, [ mk('Claude', 600000, true), mk('Chat GPT', 500000, false) ]),

    else if (r.save >= r.goal) tag = '<span class="gtag ok">✅ Đạt mục tiêu ' + fmt(r.goal) + (r.save > r.goal ? ', dư ' + fmt(r.save - r.goal) : '') + '</span>';
    else tag = '<span class="gtag bad">⚠️ Thiếu ' + fmt(r.goal - r.save) + ' so với mục tiêu ' + fmt(r.goal) + '</span>';
    h += '<button class="srow' + (r.future ? ' future' : '') + '" data-act="open-month" data-k="' + r.k + '"><span class="m"><b>' + monthLabel(r.k) + (r.future ? ' · chưa tới' : '') + '</b><small class="num">Thu ' + fmt(r.income) + ' − Chi ' + fmt(r.spent) + '</small>' + tag + '</span>' +
      '<span class="v num ' + (r.save < 0 ? 'neg' : 'pos') + '">' + (r.save > 0 ? '+' : '') + fmt(r.save) + (rate !== null ? '<small>' + rate + '% thu nhập</small>' : '') + '</span></button>';
  });
  h += '<div class="cnt" style="margin:12px 4px;font-size:12.5px;color:var(--muted)">Tiết kiệm mỗi tháng = thu nhập − tổng chi đã ghi (đúng số "Dự kiến để dành" ở trang tháng). Tổng chỉ cộng các tháng đã tới; tháng sau hiện mờ và chưa được tính. Bấm vào một tháng để mở.</div>';
  return h;
}
function countUp(el, to){
  if (!el) return;
  var t0 = null, dur = 700;
  function step(ts){
    if (t0 === null) t0 = ts;
    var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(step); else el.textContent = fmt(to);
  }
  requestAnimationFrame(step);
}

/* ---------- actions ---------- */
function commit(anim){ save(); render(anim); }

  'seed-oct': function(){

  'add-sec': function(){
    openModal({ title: 'Thêm đề mục', fields: [
      { label: 'Tên đề mục', type: 'text', placeholder: 'Ví dụ: Chi phí cố định' },

      onSave: function(v){
        if (!v[0].trim()) { toast('Nhập tên đề mục'); return false; }
        var b = moneyOrWarn(v[1]); if (b === null) return false;
        M().sections.push({ id: uid(), name: v[0].trim(), budget: b, fixed: v[2], collapsed: false, cats: [] }); commit();
      } });
  },
  'edit-sec': function(d){
    var s = findSec(d.s);
    openModal({ title: 'Sửa đề mục', fields: [
      { label: 'Tên đề mục', type: 'text', value: s.name },
      { label: 'Ngân sách cả đề mục (0 = cộng từ mục con)', type: 'money', value: s.budget || '' },
      { label: 'Đề mục cố định (sang tháng mới giữ tên các khoản, chỉ nhập lại tiền)', type: 'checkbox', value: s.fixed }],
      onSave: function(v){
        if (!v[0].trim()) { toast('Nhập tên đề mục'); return false; }
        var b = moneyOrWarn(v[1]); if (b === null) return false;
        s.name = v[0].trim(); s.budget = b; s.fixed = v[2]; commit();
      },
      onDelete: function(){ var m = M(); m.sections = m.sections.filter(function(x){ return x.id !== s.id; }); commit(); } });
  },
  'add-cat': function(d){
    openModal({ title: 'Thêm mục', fields: [
      { label: 'Tên mục', type: 'text', placeholder: 'Ví dụ: Ăn uống' },
      { label: 'Ngân sách của mục (không bắt buộc)', type: 'money', placeholder: 'Vượt số này sẽ có cảnh báo' }],
      onSave: function(v){
        if (!v[0].trim()) { toast('Nhập tên mục'); return false; }
        var b = moneyOrWarn(v[1]); if (b === null) return false;
        findSec(d.s).cats.push({ id: uid(), name: v[0].trim(), budget: b, items: [] }); commit();
      } });
  },
  'edit-cat': function(d){
    var c = findCat(d.s, d.c), s = findSec(d.s);
    openModal({ title: 'Sửa mục', fields: [
      { label: 'Tên mục', type: 'text', value: c.name },
      { label: 'Ngân sách của mục (0 = không giới hạn)', type: 'money', value: c.budget || '' },
      { label: 'Thuộc đề mục', type: 'select', value: s.id, options: M().sections.map(function(x){ return { v: x.id, l: x.name }; }) }],
      onSave: function(v){
        if (!v[0].trim()) { toast('Nhập tên mục'); return false; }
        var b = moneyOrWarn(v[1]); if (b === null) return false;
        c.name = v[0].trim(); c.budget = b;
        if (v[2] && v[2] !== s.id) { s.cats = s.cats.filter(function(x){ return x.id !== c.id; }); findSec(v[2]).cats.push(c); }
        commit();
      },
      onDelete: function(){ s.cats = s.cats.filter(function(x){ return x.id !== c.id; }); commit(); } });
  },
  'add-item': function(d){
    var c = findCat(d.s, d.c);
    openModal({ title: 'Thêm khoản chi vào "' + c.name + '"', fields: [
      { label: 'Tên khoản chi', type: 'text', placeholder: 'Ví dụ: Cơm trưa' },
      { label: 'Số tiền', type: 'money', placeholder: 'Ví dụ 35k', hint: 'Gõ nhanh: 35k, 1.2tr, 150000' },
      { label: 'Ghi chú (không bắt buộc)', type: 'text', placeholder: '' },
      { label: 'Đã trả rồi', type: 'checkbox', value: false }],
      onSave: function(v){
        if (!v[0].trim()) { toast('Nhập tên khoản chi'); return false; }
        var n = moneyOrWarn(v[1]); if (n === null) return false;
        c.items.push({ id: uid(), name: v[0].trim(), amount: n, note: v[2].trim(), paid: v[3] }); commit();
      } });
  },
  'edit-item': function(d){
    var c = findCat(d.s, d.c); var it = c.items.filter(function(x){ return x.id === d.i; })[0];
    openModal({ title: 'Sửa khoản chi', fields: [
      { label: 'Tên khoản chi', type: 'text', value: it.name },
      { label: 'Số tiền', type: 'money', value: it.amount || '', hint: it.prev ? 'Tháng trước: ' + fmt(it.prev) : '' },
      { label: 'Ghi chú', type: 'text', value: it.note || '' },
      { label: 'Đã trả rồi', type: 'checkbox', value: it.paid }],
      onSave: function(v){
        if (!v[0].trim()) { toast('Nhập tên khoản chi'); return false; }
        var n = moneyOrWarn(v[1]); if (n === null) return false;
        it.name = v[0].trim(); it.amount = n; it.note = v[2].trim(); it.paid = v[3]; commit();
      },
      onDelete: function(){ c.items = c.items.filter(function(x){ return x.id !== it.id; }); commit(); } });
  },
  'new-month': function(){
    var keys = sortedKeys(), last = keys[keys.length - 1];
    var p = last.split('-'), y = parseInt(p[0], 10), mo = parseInt(p[1], 10) + 1; if (mo > 12) { mo = 1; y++; }
    var def = y + '-' + String(mo).padStart(2, '0');
    openModal({ title: 'Thêm tháng mới', saveLabel: 'Tạo tháng', fields: [
      { label: 'Chọn tháng', type: 'month', value: def },
      { label: 'Sao chép từ ' + monthLabel(S.current).toLowerCase() + ' (giữ đề mục, mục, ngân sách. Đề mục cố định giữ tên khoản để nhập lại tiền, đề mục bất định để trống)', type: 'checkbox', value: true }],
      onSave: function(v){
        var k = v[0];
        if (!/^\d{4}-\d{2}$/.test(k)) { toast('Chọn tháng hợp lệ'); return false; }
        if (S.months[k]) { S.current = k; commit(true); toast('Tháng này đã có, đã chuyển sang'); return; }
        if (v[1]) { var d = cloneForNext(M()); S.months[k] = d; }
        else S.months[k] = newMonthData();
        S.current = k; commit(true);
      } });
  },
  'del-month': function(){
    ask('Xóa toàn bộ dữ liệu ' + monthLabel(S.current).toLowerCase() + '? Không thể hoàn tác.', function(){
      var i = sortedKeys().indexOf(S.current);
      delete S.months[S.current];
      var rest = sortedKeys();
      if (!rest.length) { var k = monthKeyNow(); S.months[k] = newMonthData(); S.current = k; }
      else S.current = rest[Math.min(Math.max(0, i - 1), rest.length - 1)];
      commit(true); toast('Đã xóa tháng');
    });
  },
  'export-file': function(){
    try {
      var blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chi-tieu-sao-luu-' + todayStr() + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      S.lastBackup = todayStr(); commit(); toast('Đã tải file sao lưu vào máy');
    } catch(e){ toast('Không tải được file. Hãy dùng "Sao lưu bằng chữ".'); }
  },
  'import-file': function(){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function(){
      var f = inp.files && inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function(){
        try {
          var d = JSON.parse(rd.result);
          if (!d || !d.months || !Object.keys(d.months).length) throw 0;
          ask('Thay toàn bộ dữ liệu hiện tại bằng file "' + f.name + '"?', function(){
            S = d; S.seeded = true; var ks = sortedKeys(); if (!S.current || !S.months[S.current]) S.current = ks[ks.length - 1];
            commit(true); toast('Đã khôi phục từ file');
          });
        } catch(e){ toast('File không đúng định dạng sao lưu'); }
      };
      rd.readAsText(f);
    };
    inp.click();
  },
  'page': function(d){ page = d.p; ovSel = S.current; commit(); window.scrollTo(0, 0); },
  'ov-month': function(d){ ovSel = d.k; render(); },
  'open-month': function(d){ S.current = d.k; page = 'month'; commit(true); window.scrollTo(0, 0); },
  'big-goal': function(){
    var g = S.bigGoal || {};
    openModal({ title: 'Mục tiêu tiết kiệm lớn', fields: [
      { label: 'Tên mục tiêu', type: 'text', value: g.name || '', placeholder: 'Ví dụ: Mua laptop' },
      { label: 'Số tiền cần', type: 'money', value: g.amount || '', placeholder: 'Ví dụ 20tr', hint: 'Gõ nhanh: 500k, 20tr' }],
      onSave: function(v){
        var n = moneyOrWarn(v[1]); if (n === null) return false;
        if (!n) { toast('Nhập số tiền mục tiêu'); return false; }
        S.bigGoal = { name: v[0].trim() || 'Mục tiêu', amount: n }; commit();
      },
      onDelete: g.amount ? function(){ delete S.bigGoal; commit(); } : null, deleteMsg: 'Xóa mục tiêu này?' });
  },
  'init-bal': function(){
    var ib = S.initialBalance || 0;
    openModal({ title: 'Số dư ban đầu', fields: [
      { label: 'Tiền bạn đang có trước tháng đầu tiên ghi trong app', type: 'money', value: Math.abs(ib) || '', placeholder: 'Ví dụ 2tr', hint: 'Gõ nhanh: 500k, 2.5tr' },
      { label: 'Đây là số âm (đang nợ)', type: 'checkbox', value: ib < 0 }],
      onSave: function(v){ var n = moneyOrWarn(v[0]); if (n === null) return false; S.initialBalance = v[1] ? -n : n; commit(); } });
  },
  'backup': function(){
    var json = JSON.stringify(S);
    openModal({ title: 'Sao lưu / khôi phục', saveLabel: 'Khôi phục (thay dữ liệu hiện tại)', fields: [
      { label: 'Dữ liệu của bạn', type: 'textarea', value: json, hint: 'Để sao lưu: chọn hết, sao chép rồi dán vào Ghi chú. Để khôi phục: dán dữ liệu cũ vào đây rồi nhấn nút bên dưới.' }],
      onSave: function(v){
        try {
          var d = JSON.parse(v[0]);
          if (!d || !d.months || typeof d.months !== 'object') throw 0;
          S = d; var ks = sortedKeys(); if (!ks.length) throw 0;
          if (!S.current || !S.months[S.current]) S.current = ks[ks.length - 1];
          commit(); toast('Đã khôi phục');
        } catch(e){ toast('Dữ liệu không hợp lệ'); return false; }
      } });
  },
  'theme': function(){
    var r = document.documentElement, cur = r.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  }
};

document.getElementById('app').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'month') return;
  var d = { s: el.getAttribute('data-s'), c: el.getAttribute('data-c'), i: el.getAttribute('data-i'), k: el.getAttribute('data-k'), p: el.getAttribute('data-p') };
  if (actions[act]) actions[act](d);
});
document.getElementById('app').addEventListener('change', function(e){
  if (e.target.getAttribute('data-act') === 'month') { S.current = e.target.value; commit(true); }
});

render(true);
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
